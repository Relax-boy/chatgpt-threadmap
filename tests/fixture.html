<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../src/content/navigator.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #263130; background: #f7f7f3; font: 16px/1.65 ui-sans-serif, system-ui, sans-serif; }
    .shell { display: grid; grid-template-columns: 220px 1fr; height: 100vh; }
    aside { padding: 30px 24px; color: #d8dedb; background: #202725; }
    aside strong { display: block; margin-bottom: 34px; color: white; font: 600 20px Georgia, serif; }
    aside span { display: block; margin: 16px 0; font-size: 13px; opacity: .7; }
    .scroll-pane { height: 100vh; overflow-y: auto; padding: 80px max(9vw, 90px); }
    article { min-height: 360px; max-width: 760px; margin: auto; }
    article p { max-width: 650px; }
    h5 { position: absolute; width: 1px; height: 1px; overflow: hidden; }
    [class*="group/user-message"] { width: fit-content; max-width: 70%; margin-left: auto; padding: 14px 18px; border-radius: 20px; background: #e7e7df; }
  </style>
</head>
<body>
  <main class="shell">
    <aside><strong>ChatGPT</strong><span>New chat</span><span>Research notes</span><span>Design review</span></aside>
    <div class="scroll-pane">
      <article data-testid="conversation-turn-0"><h5>你说：</h5><div class="group/user-message"><div class="whitespace-pre-wrap">第一个问题</div></div></article>
      <article data-testid="conversation-turn-1"><h5>ChatGPT 说：</h5><p>我们可以先建立清晰的目标和边界，然后把问题拆成几个可以验证的小步骤。这样长对话仍然容易回顾。</p></article>
      <article data-testid="conversation-turn-2"><h5>You said:</h5><div class="group/user-message"><div class="whitespace-pre-wrap">第二个问题</div></div></article>
      <article data-testid="conversation-turn-3"><h5>ChatGPT said:</h5><p>第二阶段重点是验证定位行为，并确保滚动过程中当前条目会实时更新。</p></article>
      <article data-testid="conversation-turn-4"><h5>你说：</h5><div class="group/user-message"><div class="whitespace-pre-wrap">第三个问题</div></div></article>
    </div>
  </main>
  <script src="../src/content/navigator.js"></script>
</body>
</html>
